<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Simple Bill — simple, offline-first invoicing for a single business." />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // Theme only (not business data): apply the saved theme before paint
      // to avoid a light/dark flash. The store reconciles this later.
      try { if (localStorage.getItem('simple-bill-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <title>Simple Bill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
